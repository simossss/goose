plugins {
    id "com.android.application"
}

android {
    namespace "com.goose.android"
    compileSdk 36

    defaultConfig {
        applicationId "com.goose.android"
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "0.1.0"
        testInstrumentationRunner "com.goose.android.GooseRustBridgeInstrumentationTest"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ["../../Rust/android"]
        }
    }
}
